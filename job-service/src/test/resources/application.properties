server.port=0
spring.application.name=job-service

# In-memory H2 database configured in PostgreSQL compatibility mode for unit tests
spring.datasource.url=jdbc:h2:mem:jobdb_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Eureka registration during test runs
eureka.client.enabled=false
